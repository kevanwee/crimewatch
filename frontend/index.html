<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrimeWatch Heatmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="hero-kicker">Singapore eLitigation</p>
        <h1>CrimeWatch Heatmap</h1>
        <p class="hero-subtitle">
          Incident-location weighted map from criminal judgments with institution-context filtering.
        </p>
      </header>

      <section class="controls" aria-label="Heatmap controls">
        <label>
          Year from
          <input id="year-from" type="number" min="1990" placeholder="Auto" />
        </label>
        <label>
          Year to
          <input id="year-to" type="number" min="1990" placeholder="Auto" />
        </label>
        <label>
          Min score
          <input id="min-weight" type="number" min="0" max="1" step="0.1" value="0.2" />
        </label>
        <button id="refresh-button" type="button">Refresh Map</button>
      </section>

      <section class="stats" aria-live="polite">
        <div>
          <span class="stats-label">Cases</span>
          <span id="case-count">-</span>
        </div>
        <div>
          <span class="stats-label">Hotspots</span>
          <span id="point-count">-</span>
        </div>
        <div>
          <span class="stats-label">Dataset</span>
          <span id="dataset-name">-</span>
        </div>
      </section>

      <section class="map-card">
        <div id="map" role="img" aria-label="Crime heatmap"></div>
      </section>

      <p id="message" class="message"></p>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
